                      icon: item.checked ? 'mdi:checkbox-marked' : 'mdi:checkbox-blank-outline',
                      size: '20px',
                      tap_action: {
                        action: 'call-service',
                        service: item.checked ? 'pyscript.restaurant_unmark_visited' : 'pyscript.restaurant_mark_visited',
                        service_data: { id: item.id }
                      },
                      styles: {
                        card: [
                          { 'box-shadow': 'none' },
                          { border: 'none' },
                          { 'border-radius': '6px' },
                          { padding: '3px 14px' },
                          { margin: '0' },
                          { 'background-color': item.has_deal_today ? 'rgba(240,165,0,0.18)' : 'transparent' }
                        ],
                        grid: [
                          { 'grid-template-areas': '"i n"' },
                          { 'grid-template-columns': 'min-content 1fr' },
                          { 'align-items': 'center' }
                        ],
                        icon: [
                          { color: item.checked ? '#9e9e9e' : (item.has_deal_today ? '#f0a500' : 'var(--secondary-text-color)') },
                          { width: '20px' }
                        ],
                        name: [
                          { 'justify-self': 'start' },
                          { 'padding-left': '8px' },
                          { 'font-size': '14px' },
                          { 'font-weight': (!item.checked && item.has_deal_today) ? '600' : '400' },
                          { color: item.checked ? '#9e9e9e' : 'var(--primary-text-color)' },
                          { 'text-decoration': item.checked ? 'line-through' : 'none' }
                        ]
                      }
                    })) }

      - type: custom:stack-in-card
        view_layout:
          grid-area: sitdown
        card_mod:
          style: |
            ha-card { padding-bottom: 12px; }
        cards:
